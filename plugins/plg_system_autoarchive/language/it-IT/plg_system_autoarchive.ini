PLG_SYSTEM_AUTOARCHIVE="Sistema - Auto Archive"

PLG_SYSTEM_AUTOARCHIVE_NOTE_AUTOMATION_DESC="L'automazione è spenta di serie. Se la accendi tiene gli articoli archiviati in una categoria: <strong>Archivia</strong> sposta l'articolo nella categoria scelta, e un articolo pubblicato salvato o spostato (anche con Elaborazione in serie) in quella categoria viene archiviato. L'archiviazione passa dal modello articolo di Joomla, quindi Ricerca intelligente, cache e gli altri plugin si aggiornano come con un clic a mano."
PLG_SYSTEM_AUTOARCHIVE_FIELD_AUTOMATION_LABEL="Attiva automazione"
PLG_SYSTEM_AUTOARCHIVE_FIELD_AUTOMATION_DESC="Accende la sincronizzazione automatica fra lo stato Archiviato e la categoria scelta qui sotto."
PLG_SYSTEM_AUTOARCHIVE_FIELD_TARGET_CATID_LABEL="Categoria archivio"
PLG_SYSTEM_AUTOARCHIVE_FIELD_TARGET_CATID_DESC="Categoria che raccoglie gli articoli archiviati. Finché non scegli una categoria l'automazione non fa nulla."
PLG_SYSTEM_AUTOARCHIVE_FIELD_REQUIRE_CREATE_LABEL="Richiedi il permesso di creare"
PLG_SYSTEM_AUTOARCHIVE_FIELD_REQUIRE_CREATE_DESC="Sposta gli articoli archiviati solo se chi li archivia può anche creare articoli nella categoria archivio. Serve sempre il permesso Modifica stato sull'articolo, gli articoli in modifica da un altro utente non vengono mai spostati e ospiti o riga di comando non spostano nulla."
PLG_SYSTEM_AUTOARCHIVE_FIELD_MOVE_ON_ARCHIVE_LABEL="Sposta gli articoli archiviati"
PLG_SYSTEM_AUTOARCHIVE_FIELD_MOVE_ON_ARCHIVE_DESC="Quando un articolo viene archiviato (dall'elenco, dalla barra strumenti, dal modulo di modifica o dall'API) viene spostato nella categoria archivio."
PLG_SYSTEM_AUTOARCHIVE_FIELD_REDIRECT_ON_MOVE_LABEL="Redirect 301 dal vecchio indirizzo"
PLG_SYSTEM_AUTOARCHIVE_FIELD_REDIRECT_ON_MOVE_DESC="Se la categoria fa parte dell'indirizzo dell'articolo, entrare nella categoria archivio cambia l'URL: sia quando l'automazione sposta un articolo archiviato, sia quando archivia un articolo pubblicato spostato lì da un utente. Con questa opzione il vecchio indirizzo viene reindirizzato (301) al nuovo tramite il componente <em>Reindirizzamenti</em> di Joomla o in 4SEO (vedi l'opzione seguente), così link e motori di ricerca non finiscono su una pagina 404. Con i Reindirizzamenti di Joomla serve il plugin <em>Sistema - Reindirizzamento</em> attivo. Se l'indirizzo non cambia non viene salvato nulla."
PLG_SYSTEM_AUTOARCHIVE_FIELD_ARCHIVE_ON_MOVE_LABEL="Archivia gli articoli spostati nella categoria"
PLG_SYSTEM_AUTOARCHIVE_FIELD_ARCHIVE_ON_MOVE_DESC="Quando un articolo pubblicato viene salvato nella categoria archivio, o spostato lì con Elaborazione in serie, viene archiviato."
PLG_SYSTEM_AUTOARCHIVE_FIELD_FORCE_ARCHIVED_LABEL="Forza archiviato"
PLG_SYSTEM_AUTOARCHIVE_FIELD_FORCE_ARCHIVED_DESC="Spento: un articolo che è già nella categoria archivio può essere ripubblicato apposta. Acceso: ogni articolo pubblicato nella categoria archivio viene archiviato di nuovo, anche quando lo ripubblichi."
PLG_SYSTEM_AUTOARCHIVE_MSG_ARCHIVED_N="Auto Archive: %d articoli archiviati perché sono nella categoria archivio."
PLG_SYSTEM_AUTOARCHIVE_MSG_ARCHIVED_N_1="Auto Archive: 1 articolo archiviato perché è nella categoria archivio."
PLG_SYSTEM_AUTOARCHIVE_MSG_MOVED_N="Auto Archive: %d articoli archiviati spostati nella categoria archivio."
PLG_SYSTEM_AUTOARCHIVE_MSG_MOVED_N_1="Auto Archive: 1 articolo archiviato spostato nella categoria archivio."
PLG_SYSTEM_AUTOARCHIVE_MSG_REDIRECTS_N="Auto Archive: %d redirect 301 dai vecchi indirizzi salvati in Reindirizzamenti."
PLG_SYSTEM_AUTOARCHIVE_MSG_REDIRECTS_N_1="Auto Archive: 1 redirect 301 dal vecchio indirizzo salvato in Reindirizzamenti."
PLG_SYSTEM_AUTOARCHIVE_MSG_REDIRECT_PLUGIN_OFF="Auto Archive: l'automazione salva i redirect 301 dai vecchi indirizzi degli articoli spostati, ma il plugin <em>Sistema - Reindirizzamento</em> è spento e non vengono applicati. Accendi il plugin, oppure spegni l'opzione redirect di Auto Archive."
PLG_SYSTEM_AUTOARCHIVE_MSG_ARCHIVE_FAILED="Auto Archive: alcuni articoli non sono stati archiviati in automatico. Dettagli nel log administrator/logs/plg_system_autoarchive.php."
PLG_SYSTEM_AUTOARCHIVE_MSG_MOVE_FAILED="Auto Archive: alcuni articoli archiviati non sono stati spostati nella categoria archivio. Dettagli nel log administrator/logs/plg_system_autoarchive.php."
PLG_SYSTEM_AUTOARCHIVE_MSG_MOVE_SKIPPED="Auto Archive: alcuni articoli archiviati non sono stati spostati nella categoria archivio (permesso mancante, oppure l'articolo è in modifica da un altro utente). Dettagli nel log administrator/logs/plg_system_autoarchive.php."
PLG_SYSTEM_AUTOARCHIVE_MSG_TARGET_INVALID="Auto Archive: la categoria archivio scelta nelle opzioni del plugin non esiste più o è nel cestino. L'automazione è ferma finché non scegli un'altra categoria."
PLG_SYSTEM_AUTOARCHIVE_MSG_TARGET_UNPUBLISHED="Auto Archive: la categoria archivio scelta nelle opzioni del plugin non è pubblicata. Gli articoli che l'automazione sposta lì non compaiono nel sito pubblico, nemmeno nella pagina archivio. Pubblica la categoria o scegline un'altra."

PLG_SYSTEM_AUTOARCHIVE_FIELD_REDIRECT_TARGET_LABEL="Salva i redirect in"
PLG_SYSTEM_AUTOARCHIVE_FIELD_REDIRECT_TARGET_DESC="Dove tenere il redirect 301 dal vecchio indirizzo. Automatico: in 4SEO se e' installato, attivo e con i redirect accesi, altrimenti nel componente Reindirizzamenti di Joomla. Se un articolo che gia' aveva un redirect verso il vecchio indirizzo viene spostato di nuovo, quel redirect viene puntato al nuovo indirizzo, cosi' i visitatori non fanno mai due salti."
PLG_SYSTEM_AUTOARCHIVE_REDIRECT_TARGET_AUTO="Automatico (4SEO se c'e', altrimenti Joomla)"
PLG_SYSTEM_AUTOARCHIVE_REDIRECT_TARGET_JOOMLA="Reindirizzamenti di Joomla"
PLG_SYSTEM_AUTOARCHIVE_REDIRECT_TARGET_FORSEO="Regole di redirect di 4SEO"
PLG_SYSTEM_AUTOARCHIVE_MSG_REDIRECTS_FORSEO_N="Auto Archive: %d redirect 301 dai vecchi indirizzi salvati come regole di 4SEO."
PLG_SYSTEM_AUTOARCHIVE_MSG_REDIRECTS_FORSEO_N_1="Auto Archive: 1 redirect 301 dal vecchio indirizzo salvato come regola di 4SEO."
