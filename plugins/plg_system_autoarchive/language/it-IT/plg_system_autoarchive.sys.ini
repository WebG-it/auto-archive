PLG_SYSTEM_AUTOARCHIVE="Sistema - Auto Archive"
PLG_SYSTEM_AUTOARCHIVE_XML_DESCRIPTION="Tiene gli articoli archiviati del sito in una sola categoria. Quando un articolo viene archiviato lo sposta nella categoria scelta; quando un articolo pubblicato viene salvato o spostato (anche con Elaborazione in serie) in quella categoria lo archivia, passando dal modello articolo di Joomla, così Ricerca intelligente e cache restano aggiornate. Redirect 301 facoltativi dal vecchio indirizzo. Joomla puro: funziona con o senza YOOtheme. Spento di serie."
PLG_SYSTEM_AUTOARCHIVE_IMPORTED="Auto Archive: le impostazioni dell'automazione di Layout archivio per YOOtheme sono state importate (categoria archivio %d). L'automazione di Layout archivio per YOOtheme è stata spenta, così non gira due volte: da ora lavora Auto Archive. Controlla le opzioni di questo plugin."
PLG_SYSTEM_AUTOARCHIVE_IMPORTED_OFF="Auto Archive: le impostazioni di Layout archivio per YOOtheme sono state importate. Lì l'automazione era spenta e resta spenta: accendila nelle opzioni di questo plugin quando vuoi."
PLG_SYSTEM_AUTOARCHIVE_IMPORTED_NOCAT="Auto Archive: le impostazioni di Layout archivio per YOOtheme sono state importate, ma lì non era scelta nessuna categoria archivio. L'automazione di Layout archivio per YOOtheme è stata spenta. Scegli la categoria archivio nelle opzioni di questo plugin."
