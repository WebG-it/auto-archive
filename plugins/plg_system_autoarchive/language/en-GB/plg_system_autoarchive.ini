PLG_SYSTEM_AUTOARCHIVE="System - Auto Archive"
PLG_SYSTEM_AUTOARCHIVE_NOTE_AUTOMATION_DESC="The automation is off by default. When on, it keeps the archived articles in one category: <strong>Archive</strong> moves the article to the chosen category, and a published article saved or moved (also by batch) into that category is archived. The archiving goes through the Joomla article model, so Smart Search, cache and the other plugins are updated as with a manual click."
PLG_SYSTEM_AUTOARCHIVE_FIELD_AUTOMATION_LABEL="Enable automation"
PLG_SYSTEM_AUTOARCHIVE_FIELD_AUTOMATION_DESC="Switch on the automatic sync between the Archived state and the category chosen below."
PLG_SYSTEM_AUTOARCHIVE_FIELD_TARGET_CATID_LABEL="Archive category"
PLG_SYSTEM_AUTOARCHIVE_FIELD_TARGET_CATID_DESC="Category that holds the archived articles. The automation does nothing until a category is selected."
PLG_SYSTEM_AUTOARCHIVE_FIELD_REQUIRE_CREATE_LABEL="Require create permission"
PLG_SYSTEM_AUTOARCHIVE_FIELD_REQUIRE_CREATE_DESC="Move archived articles only when the user who archives them can also create articles in the archive category. The user always needs the Edit State permission on the article, articles being edited by another user are never moved, and guests or the command line never move anything."
PLG_SYSTEM_AUTOARCHIVE_FIELD_MOVE_ON_ARCHIVE_LABEL="Move archived articles"
PLG_SYSTEM_AUTOARCHIVE_FIELD_MOVE_ON_ARCHIVE_DESC="When an article is archived (from the list, the toolbar, the edit form or the API) it is moved to the archive category."
PLG_SYSTEM_AUTOARCHIVE_FIELD_REDIRECT_ON_MOVE_LABEL="301 redirect from the old address"
PLG_SYSTEM_AUTOARCHIVE_FIELD_REDIRECT_ON_MOVE_DESC="When the category is part of the article address, moving an article into the archive category changes its URL: both when the automation moves an archived article and when a published article moved there by a user is archived. With this option the old address is redirected (301) to the new one through the Joomla <em>Redirects</em> component or 4SEO (see the next option), so links and search engines do not end on a 404 page. With Joomla Redirects it needs the <em>System - Redirect</em> plugin switched on. Nothing is stored when the address does not change."
PLG_SYSTEM_AUTOARCHIVE_FIELD_ARCHIVE_ON_MOVE_LABEL="Archive articles moved into the category"
PLG_SYSTEM_AUTOARCHIVE_FIELD_ARCHIVE_ON_MOVE_DESC="When a published article is saved into the archive category, or moved there with Batch, it is archived."
PLG_SYSTEM_AUTOARCHIVE_FIELD_FORCE_ARCHIVED_LABEL="Force archived"
PLG_SYSTEM_AUTOARCHIVE_FIELD_FORCE_ARCHIVED_DESC="Off: an article that is already in the archive category can be published again on purpose. On: every published article in the archive category is archived again, also when it is republished."
PLG_SYSTEM_AUTOARCHIVE_MSG_ARCHIVED_N="Auto Archive: %d articles archived because they are in the archive category."
PLG_SYSTEM_AUTOARCHIVE_MSG_ARCHIVED_N_1="Auto Archive: 1 article archived because it is in the archive category."
PLG_SYSTEM_AUTOARCHIVE_MSG_MOVED_N="Auto Archive: %d archived articles moved to the archive category."
PLG_SYSTEM_AUTOARCHIVE_MSG_MOVED_N_1="Auto Archive: 1 archived article moved to the archive category."
PLG_SYSTEM_AUTOARCHIVE_MSG_REDIRECTS_N="Auto Archive: %d redirects 301 from the old addresses stored in Redirects."
PLG_SYSTEM_AUTOARCHIVE_MSG_REDIRECTS_N_1="Auto Archive: 1 redirect 301 from the old address stored in Redirects."
PLG_SYSTEM_AUTOARCHIVE_MSG_REDIRECT_PLUGIN_OFF="Auto Archive: the automation stores 301 redirects from the old addresses of moved articles, but the <em>System - Redirect</em> plugin is off, so they are not applied. Switch the plugin on, or turn off the redirect option of Auto Archive."
PLG_SYSTEM_AUTOARCHIVE_MSG_ARCHIVE_FAILED="Auto Archive: some articles could not be archived automatically. Details in the log administrator/logs/plg_system_autoarchive.php."
PLG_SYSTEM_AUTOARCHIVE_MSG_MOVE_FAILED="Auto Archive: some archived articles could not be moved to the archive category. Details in the log administrator/logs/plg_system_autoarchive.php."
PLG_SYSTEM_AUTOARCHIVE_MSG_MOVE_SKIPPED="Auto Archive: some archived articles were not moved to the archive category (missing permission, or the article is being edited by another user). Details in the log administrator/logs/plg_system_autoarchive.php."
PLG_SYSTEM_AUTOARCHIVE_MSG_TARGET_INVALID="Auto Archive: the archive category chosen in the plugin options no longer exists or is in the trash. The automation is paused until you choose another category."
PLG_SYSTEM_AUTOARCHIVE_MSG_TARGET_UNPUBLISHED="Auto Archive: the archive category chosen in the plugin options is not published. Articles moved there by the automation do not appear on the public site, not even on the archive page. Publish the category or choose another one."

PLG_SYSTEM_AUTOARCHIVE_FIELD_REDIRECT_TARGET_LABEL="Store the redirects in"
PLG_SYSTEM_AUTOARCHIVE_FIELD_REDIRECT_TARGET_DESC="Where the 301 redirect from the old address is kept. Automatic: in 4SEO when it is installed, enabled and its redirects are on, otherwise in the Joomla Redirects component. When an article already redirected to the old address is moved again, that redirect is pointed to the new address, so visitors never go through two redirects."
PLG_SYSTEM_AUTOARCHIVE_REDIRECT_TARGET_AUTO="Automatic (4SEO if available, otherwise Joomla)"
PLG_SYSTEM_AUTOARCHIVE_REDIRECT_TARGET_JOOMLA="Joomla Redirects"
PLG_SYSTEM_AUTOARCHIVE_REDIRECT_TARGET_FORSEO="4SEO redirect rules"
PLG_SYSTEM_AUTOARCHIVE_MSG_REDIRECTS_FORSEO_N="Auto Archive: %d redirects 301 from the old addresses stored as 4SEO rules."
PLG_SYSTEM_AUTOARCHIVE_MSG_REDIRECTS_FORSEO_N_1="Auto Archive: 1 redirect 301 from the old address stored as a 4SEO rule."
