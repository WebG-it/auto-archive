PLG_SYSTEM_AUTOARCHIVE="System - Auto Archive"
PLG_SYSTEM_AUTOARCHIVE_XML_DESCRIPTION="Keeps the archived articles of your site in one category. When an article is archived it is moved to the category you choose; when a published article is saved or moved (also with Batch) into that category it is archived, through the Joomla article model so Smart Search and the cache stay up to date. Optional 301 redirects from the old address. Plain Joomla: works with or without YOOtheme. Off by default."
PLG_SYSTEM_AUTOARCHIVE_IMPORTED="Auto Archive: the automation settings of Archive Layouts for YOOtheme were imported (archive category %d). The automation of Archive Layouts for YOOtheme was switched off, so it does not run twice: Auto Archive does the work from now on. Check the options of this plugin."
PLG_SYSTEM_AUTOARCHIVE_IMPORTED_OFF="Auto Archive: the settings of Archive Layouts for YOOtheme were imported. The automation was off there and stays off: switch it on in the options of this plugin when you want it."
PLG_SYSTEM_AUTOARCHIVE_IMPORTED_NOCAT="Auto Archive: the settings of Archive Layouts for YOOtheme were imported, but no archive category was chosen there. The automation of Archive Layouts for YOOtheme was switched off. Choose the archive category in the options of this plugin."
